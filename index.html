
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora AI — Multi-Feature Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #111827;
            color: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
        }

        .scrollbar::-webkit-scrollbar {
            width: 7px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #111827;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 10px;
        }

        .message-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }

        .recording {
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        .typing-dot {
            animation: typing 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
            }

            30% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="w-full h-screen flex overflow-hidden bg-gray-900">

    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="w-80 bg-gray-950 border-r border-gray-800 flex flex-col hidden md:flex"
    >

        <div class="p-4 border-b border-gray-800">

            <div class="flex items-center gap-3">

                <div
                    class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center text-xl shadow-lg"
                >
                    🚀
                </div>

                <div>
                    <h1 class="text-xl font-bold">
                        Nexora AI
                    </h1>

                    <p class="text-xs text-gray-500">
                        Hindi AI Chat Assistant
                    </p>
                </div>

            </div>

        </div>

        <div class="p-4">

            <button
                onclick="newChat()"
                class="w-full bg-blue-600 hover:bg-blue-700 transition text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg"
            >
                <i class="fa-solid fa-plus"></i>
                New Chat
            </button>

        </div>

        <div class="px-4 pb-3">

            <div class="relative">

                <input
                    id="chatSearch"
                    type="text"
                    placeholder="Search chats..."
                    oninput="searchChats()"
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2 pl-10 pr-3 text-sm text-white outline-none focus:border-blue-500"
                >

                <i
                    class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500"
                ></i>

            </div>

        </div>

        <div class="flex-1 overflow-y-auto scrollbar px-3">

            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-2 py-2">
                Recent Conversations
            </p>

            <div id="chat-history-list" class="space-y-1"></div>

        </div>

        <div class="p-4 border-t border-gray-800">

            <button
                onclick="openModal('devSettingsModal')"
                class="w-full text-left text-sm text-gray-400 hover:text-white flex items-center gap-3 p-2 rounded-lg hover:bg-gray-900"
            >
                <i class="fa-solid fa-sliders"></i>
                Developer / Admin Settings
            </button>

            <div
                class="mt-2 flex items-center justify-between p-3 rounded-xl bg-gray-900"
            >

                <div class="flex items-center gap-3">

                    <div
                        class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold"
                    >
                        N
                    </div>

                    <div>

                        <p class="text-sm font-medium">
                            Nexora User
                        </p>

                        <p class="text-xs text-gray-500">
                            AI Account
                        </p>

                    </div>

                </div>

                <button
                    onclick="openModal('accountModal')"
                    class="text-gray-400 hover:text-white"
                >
                    <i class="fa-solid fa-gear"></i
